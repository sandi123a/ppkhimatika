<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peringkat Pengguna - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <div class="max-w-3xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
    <h1 class="text-2xl font-bold text-center text-green-700 mb-6">Peringkat Pengguna</h1>
    <table class="w-full text-sm border border-gray-200">
      <thead class="bg-green-600 text-white">
        <tr>
          <th class="py-2 px-4 border">Peringkat</th>
          <th class="py-2 px-4 border">Nama Pengguna</th>
          <th class="py-2 px-4 border">Poin</th>
        </tr>
      </thead>
      <tbody id="peringkatBody" class="bg-white text-center">
        <!-- Data peringkat akan ditambahkan lewat JavaScript -->
      </tbody>
    </table>
    <div class="text-center mt-6">
      <button onclick="kembali()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Kembali</button>
    </div>
  </div>

  <script>
    function tampilkanPeringkat() {
      const data = JSON.parse(localStorage.getItem("dataPengguna")) || [];
      const sorted = data.sort((a, b) => b.point - a.point);
      const tbody = document.getElementById("peringkatBody");

      tbody.innerHTML = "";

      sorted.forEach((user, index) => {
        const row = `
          <tr>
            <td class="border py-2 px-4">${index + 1}</td>
            <td class="border py-2 px-4">${user.nama}</td>
            <td class="border py-2 px-4">${user.point}</td>
          </tr>
        `;
        tbody.innerHTML += row;
      });
    }

    function kembali() {
      window.history.back();
    }

    window.onload = tampilkanPeringkat;
  </script>
</body>
</html>
