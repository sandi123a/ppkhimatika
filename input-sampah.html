<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Setor Sampah - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">

  <nav class="bg-green-700 p-4 text-white flex justify-between">
    <h1 class="text-xl font-bold">Setor Sampah</h1>
    <div>
      <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
    </div>
  </nav>

  <section class="py-6 px-4">
    <div class="max-w-md mx-auto bg-white p-6 rounded shadow">
      <h2 class="text-2xl font-bold mb-4">Input Sampah</h2>
      <form id="sampahForm" class="space-y-4">
        <div>
          <label class="block mb-1 font-medium">Jenis Sampah</label>
          <select id="jenis" class="w-full border px-3 py-2 rounded" required>
            <option value="">Pilih Jenis Sampah</option>
            <option value="Organik">Organik</option>
            <option value="Anorganik">Anorganik</option>
            <option value="Elektronik">Elektronik</option>
          </select>
        </div>
        <div>
          <label class="block mb-1 font-medium">Berat (kg)</label>
          <input type="number" id="berat" class="w-full border px-3 py-2 rounded" min="0.1" step="0.1" required>
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Kirim</button>
      </form>
    </div>
  </section>

  <section class="text-center mt-6">
    <a href="riwayat-poin.html" class="text-blue-600 hover:underline mr-4">Riwayat Poin</a>
    <a href="peringkat.html" class="text-blue-600 hover:underline">Lihat Peringkat</a>
  </section>

  <section class="text-center mt-4">
    <button onclick="window.location.href='index.html'" class="text-sm text-gray-600 hover:underline">← Kembali ke Beranda</button>
  </section>

  <footer class="bg-green-700 text-white text-center py-4 mt-10">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    const form = document.getElementById("sampahForm");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const jenis = document.getElementById("jenis").value;
      const berat = parseFloat(document.getElementById("berat").value);
      const point = Math.round(berat * 10); // Konversi 1 kg = 10 poin
      const email = localStorage.getItem("loggedInUser");
      const date = new Date().toLocaleString();

      let totalPoin = parseInt(localStorage.getItem(`${email}_poin`) || "0");
      totalPoin += point;
      localStorage.setItem(`${email}_poin`, totalPoin);

      // Simpan riwayat
      const history = JSON.parse(localStorage.getItem(`${email}_riwayat`) || "[]");
      history.push({
        jenis: jenis,
        berat: berat,
        point: point,
        status: "Masuk",
        date: date
      });
      localStorage.setItem(`${email}_riwayat`, JSON.stringify(history));

      alert(`Sampah berhasil disetor! Anda mendapat ${point} poin.`);
      form.reset();
    });

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }

    // Cek login
    if (!localStorage.getItem("loggedIn")) {
      alert("Silakan login terlebih dahulu.");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
