<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Daftar Akun - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <nav class="bg-green-700 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">GoSampah</h1>
      <a href="index.html" class="hover:underline">Kembali ke Login</a>
    </div>
  </nav>

  <section class="py-10 px-4 text-center">
    <h2 class="text-3xl font-bold mb-6">Daftar Pengguna Baru</h2>
    <form id="registerForm" class="max-w-md mx-auto space-y-4">
      <div>
        <label class="block text-left mb-1 font-medium">Nama Lengkap</label>
        <input type="text" id="registerName" class="w-full px-4 py-2 border rounded-md" required>
      </div>
      <div>
        <label class="block text-left mb-1 font-medium">Email</label>
        <input type="email" id="registerEmail" class="w-full px-4 py-2 border rounded-md" required>
      </div>
      <div>
        <label class="block text-left mb-1 font-medium">Kata Sandi</label>
        <input type="password" id="registerPassword" class="w-full px-4 py-2 border rounded-md" required>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">Daftar</button>
    </form>
    <p class="mt-4 text-sm">Sudah punya akun? <a href="index.html" class="text-green-600 hover:underline">Login di sini</a></p>
  </section>

  <footer class="bg-green-700 text-white text-center py-4 mt-12">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('registerName').value.trim();
      const email = document.getElementById('registerEmail').value.trim();
      const password = document.getElementById('registerPassword').value;

      if (name && email && password) {
        localStorage.setItem('userName', name);
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userPassword', password);
        alert('Pendaftaran berhasil! Silakan login.');
        window.location.href = "index.html";
      } else {
        alert('Mohon isi semua kolom.');
      }
    });
  </script>
</body>
</html>
