<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Input Sampah - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <div class="max-w-xl mx-auto mt-10 bg-white p-6 rounded shadow-lg">
    <h1 class="text-2xl font-bold text-green-700 text-center mb-4">Input Sampah</h1>

    <div class="mb-4">
      <label class="block font-medium mb-1">Jenis Sampah</label>
      <select id="jenisSampah" class="w-full border px-3 py-2 rounded">
        <option value="Plastik">Plastik</option>
        <option value="Kertas">Kertas</option>
        <option value="Logam">Logam</option>
        <option value="Kaca">Kaca</option>
        <option value="Organik">Organik</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block font-medium mb-1">Berat (Kg)</label>
      <input type="number" id="berat" class="w-full border px-3 py-2 rounded" placeholder="Masukkan berat sampah" min="0.1" step="0.1">
    </div>

    <button onclick="tambahSampah()" class="bg-green-600 hover:bg-green-700 text-white w-full py-2 rounded">Kirim</button>

    <div id="pesan" class="text-center mt-4 text-green-600 font-medium"></div>

    <div class="flex justify-between mt-6">
      <button onclick="location.href='riwayat-poin.html'" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-2 rounded">Riwayat Poin</button>
      <button onclick="location.href='peringkat.html'" class="bg-purple-500 hover:bg-purple-600 text-white px-3 py-2 rounded">Lihat Peringkat</button>
      <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded">Logout</button>
    </div>
  </div>

  <script>
    function tambahSampah() {
      const jenis = document.getElementById("jenisSampah").value;
      const berat = parseFloat(document.getElementById("berat").value);

      if (isNaN(berat) || berat <= 0) {
        alert("Masukkan berat sampah yang valid.");
        return;
      }

      const poinBaru = Math.floor(berat * 10); // 1 kg = 10 poin
      const email = localStorage.getItem("loggedInUser");
      let data = JSON.parse(localStorage.getItem("dataPengguna")) || [];

      const userIndex = data.findIndex(user => user.email === email);
      if (userIndex !== -1) {
        data[userIndex].point += poinBaru;

        // Tambah ke riwayat
        if (!data[userIndex].riwayat) data[userIndex].riwayat = [];
        data[userIndex].riwayat.push({
          tanggal: new Date().toLocaleString(),
          jenis,
          berat,
          poin: poinBaru,
          tipe: "Masuk"
        });

        localStorage.setItem("dataPengguna", JSON.stringify(data));
        document.getElementById("pesan").innerText = `Berhasil menambahkan ${poinBaru} poin!`;
        document.getElementById("berat").value = "";
      } else {
        alert("Pengguna tidak ditemukan.");
      }
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
