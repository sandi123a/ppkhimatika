<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riwayat Point - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <nav class="bg-green-700 p-4 text-white flex justify-between items-center">
    <h1 class="text-xl font-bold">Riwayat Point</h1>
    <button onclick="kembali()" class="bg-yellow-500 px-4 py-1 rounded hover:bg-yellow-600">Kembali</button>
  </nav>

  <main class="p-6 max-w-3xl mx-auto space-y-6">
    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-4">Daftar Riwayat Anda</h2>
      <ul id="daftarRiwayat" class="space-y-2 text-sm"></ul>
    </section>

    <section class="bg-white p-4 rounded shadow">
      <h2 class="text-xl font-semibold mb-4">Tukar Point</h2>
      <label class="block mb-1">Pilih Barang/Sembako</label>
      <select id="barang" class="w-full border px-3 py-2 rounded">
        <option value="">-- Pilih --</option>
        <option value="Beras 5kg:100">Beras 5kg (100 point)</option>
        <option value="Minyak 2L:80">Minyak 2L (80 point)</option>
        <option value="Gula 2kg:60">Gula 2kg (60 point)</option>
      </select>
      <button onclick="konfirmasiTukar()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Tukar Point</button>
    </section>
  </main>

  <script>
    const loggedInUser = localStorage.getItem("loggedInUser");
    const allUsers = JSON.parse(localStorage.getItem("users")) || [];
    const user = allUsers.find(u => u.email === loggedInUser);
    const riwayat = JSON.parse(localStorage.getItem("riwayatPoin") || "[]");
    const list = document.getElementById("daftarRiwayat");

    // Tampilkan riwayat milik user
    riwayat.filter(r => r.email === loggedInUser).forEach((r, i) => {
      const item = document.createElement("li");
      item.className = "border-b py-2";
      item.innerHTML = `
        <strong>${r.status === "masuk" ? "➕" : "➖"} ${r.tambahan} point</strong> - ${r.jenis || r.barang}
        <br><span class="text-gray-500">${r.tanggal}</span>
      `;
      list.appendChild(item);
    });

    function konfirmasiTukar() {
      const select = document.getElementById("barang").value;
      if (!select) return alert("Pilih barang terlebih dahulu!");

      const [barang, pointStr] = select.split(":");
      const jumlah = parseInt(pointStr);

      if (user.point < jumlah) {
        alert("Point Anda tidak cukup!");
        return;
      }

      const konfirmasi = confirm(`Apakah Anda ingin menukar ${jumlah} point dengan ${barang}?`);
      if (konfirmasi) {
        user.point -= jumlah;
        localStorage.setItem("users", JSON.stringify(allUsers));

        const riwayatBaru = {
          email: loggedInUser,
          barang: barang,
          tambahan: jumlah,
          tanggal: new Date().toLocaleString(),
          status: "keluar"
        };

        const semuaRiwayat = [...riwayat, riwayatBaru];
        localStorage.setItem("riwayatPoin", JSON.stringify(semuaRiwayat));
        localStorage.setItem("nota", JSON.stringify({
          nama: user.name,
          lokasi: user.lokasi || "Belum diisi",
          barang: barang,
          point: jumlah,
          tanggal: new Date().toLocaleString()
        }));

        alert("Penukaran berhasil!");
        window.location.href = "nota-penukaran.html";
      }
    }

    function kembali() {
      window.location.href = "input-sampah.html";
    }
  </script>
</body>
</html>
