<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nota Penukaran - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
  <div class="max-w-md mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
    <h1 class="text-center text-2xl font-bold mb-4 text-green-700">Nota Penukaran</h1>
    <div id="notaDetail" class="text-sm space-y-2">
      <!-- Konten nota akan ditampilkan via JavaScript -->
    </div>
    <div class="text-center mt-6">
      <button onclick="kembali()" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Kembali ke Riwayat</button>
    </div>
  </div>

  <script>
    const nota = JSON.parse(localStorage.getItem("nota"));
    const div = document.getElementById("notaDetail");

    if (nota) {
      div.innerHTML = `
        <p><strong>Nama:</strong> ${nota.nama}</p>
        <p><strong>Lokasi:</strong> ${nota.lokasi}</p>
        <p><strong>Barang Ditukarkan:</strong> ${nota.barang}</p>
        <p><strong>Jumlah Poin:</strong> ${nota.point}</p>
        <p><strong>Tanggal:</strong> ${nota.tanggal}</p>
        <hr class="my-3 border-gray-300">
        <p class="text-center text-sm text-gray-600">Terima kasih telah berkontribusi dalam program GoSampah!</p>
      `;
    } else {
      div.innerHTML = `<p class="text-red-600">Data nota tidak ditemukan.</p>`;
    }

    function kembali() {
      window.location.href = "riwayat-poin.html";
    }
  </script>
</body>
</html>
