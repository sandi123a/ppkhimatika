<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nota Penukaran - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

  <section class="max-w-md mx-auto bg-white shadow p-6 mt-10 rounded">
    <h2 class="text-xl font-bold mb-4 text-center">Nota Penukaran Poin</h2>
    
    <div id="notaContent" class="text-sm space-y-2">
      <p><strong>Nama:</strong> <span id="nama"></span></p>
      <p><strong>Lokasi:</strong> <span id="lokasi"></span></p>
      <p><strong>Barang Ditukarkan:</strong> <span id="barang"></span></p>
      <p><strong>Jumlah Poin:</strong> <span id="point"></span></p>
      <p><strong>Waktu:</strong> <span id="waktu"></span></p>
    </div>

    <div class="mt-6 text-center">
      <button onclick="window.location.href='input-sampah.html'" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Kembali ke Beranda
      </button>
    </div>
  </section>

  <footer class="text-center text-gray-600 text-xs mt-6">
    <p>&copy; 2025 GoSampah</p>
  </footer>

  <script>
    const email = localStorage.getItem("loggedInUser");
    const data = JSON.parse(localStorage.getItem(`${email}_lastTrade`) || "{}");

    document.getElementById("nama").textContent = data.nama || "-";
    document.getElementById("lokasi").textContent = data.lokasi || "-";
    document.getElementById("barang").textContent = data.barang || "-";
    document.getElementById("point").textContent = data.point || "-";
    document.getElementById("waktu").textContent = data.waktu || "-";
  </script>

</body>
</html>
