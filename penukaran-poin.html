<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Penukaran Poin - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">

  <nav class="bg-green-700 p-4 text-white flex justify-between">
    <h1 class="text-xl font-bold">Tukar Poin</h1>
    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
  </nav>

  <section class="max-w-2xl mx-auto py-8 px-4">
    <h2 class="text-xl font-semibold mb-4 text-center">Pilih Barang / Sembako</h2>
    
    <div class="grid gap-4">
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">Beras 5kg</h3>
        <p>500 poin</p>
        <button onclick="tukar('Beras 5kg', 500)" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">Tukar</button>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">Minyak 2L</h3>
        <p>300 poin</p>
        <button onclick="tukar('Minyak 2L', 300)" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">Tukar</button>
      </div>
      <div class="bg-white p-4 rounded shadow">
        <h3 class="font-bold text-lg">Gula 1kg</h3>
        <p>200 poin</p>
        <button onclick="tukar('Gula 1kg', 200)" class="mt-2 bg-green-600 text-white px-4 py-1 rounded hover:bg-green-700">Tukar</button>
      </div>
    </div>

    <div class="mt-6 text-center">
      <button onclick="window.location.href='riwayat-poin.html'" class="text-sm text-gray-600 hover:underline">← Kembali ke Riwayat</button>
    </div>
  </section>

  <footer class="bg-green-700 text-white text-center py-4 mt-10">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    const email = localStorage.getItem("loggedInUser");
    if (!email) {
      alert("Silakan login terlebih dahulu.");
      window.location.href = "index.html";
    }

    let poin = parseInt(localStorage.getItem(`${email}_point`) || "0");

    function tukar(namaBarang, poinBarang) {
      if (poin < poinBarang) {
        alert("Poin tidak mencukupi!");
        return;
      }

      const konfirmasi = confirm(`Apakah Anda yakin ingin menukar ${poinBarang} poin dengan ${namaBarang}?`);
      if (konfirmasi) {
        poin -= poinBarang;
        localStorage.setItem(`${email}_point`, poin.toString());

        // Simpan ke riwayat
        const riwayat = JSON.parse(localStorage.getItem(`${email}_riwayat`) || "[]");
        riwayat.push({
          status: "Keluar",
          jenis: namaBarang,
          berat: "-",
          point: `-${poinBarang}`,
          date: new Date().toLocaleString()
        });
        localStorage.setItem(`${email}_riwayat`, JSON.stringify(riwayat));

        // Simpan info penukaran untuk ditampilkan di nota
        localStorage.setItem(`${email}_lastTrade`, JSON.stringify({
          nama: localStorage.getItem("userName"),
          lokasi: localStorage.getItem("userLocation"),
          barang: namaBarang,
          point: poinBarang,
          waktu: new Date().toLocaleString()
        }));

        alert("Penukaran berhasil!");
        window.location.href = "nota-penukaran.html";
      }
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
