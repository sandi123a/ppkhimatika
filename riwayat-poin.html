<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riwayat Poin - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">

  <nav class="bg-green-700 p-4 text-white flex justify-between">
    <h1 class="text-xl font-bold">Riwayat Poin</h1>
    <button onclick="logout()" class="bg-red-500 px-3 py-1 rounded hover:bg-red-600">Logout</button>
  </nav>

  <section class="max-w-2xl mx-auto py-8 px-4">
    <h2 class="text-2xl font-semibold mb-4">Histori Transaksi</h2>
    <div id="riwayat" class="space-y-4"></div>
    <div class="mt-6 text-center">
      <button onclick="window.location.href='penukaran-poin.html'" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">Tukar Poin</button>
    </div>
    <div class="mt-4 text-center">
      <button onclick="window.location.href='input-sampah.html'" class="text-sm text-gray-600 hover:underline">← Kembali</button>
    </div>
  </section>

  <footer class="bg-green-700 text-white text-center py-4 mt-10">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    const email = localStorage.getItem("loggedInUser");
    const riwayatContainer = document.getElementById("riwayat");

    if (!email) {
      alert("Silakan login terlebih dahulu.");
      window.location.href = "index.html";
    }

    const riwayat = JSON.parse(localStorage.getItem(`${email}_riwayat`) || "[]");

    if (riwayat.length === 0) {
      riwayatContainer.innerHTML = "<p class='text-center text-gray-500'>Belum ada transaksi poin.</p>";
    } else {
      riwayat.reverse().forEach(item => {
        const div = document.createElement("div");
        div.className = "bg-white p-4 rounded shadow";
        div.innerHTML = `
          <p><strong>Status:</strong> ${item.status}</p>
          <p><strong>Jenis Sampah / Barang:</strong> ${item.jenis}</p>
          <p><strong>Berat / Jumlah:</strong> ${item.berat}</p>
          <p><strong>Poin:</strong> ${item.point}</p>
          <p><strong>Tanggal:</strong> ${item.date}</p>
        `;
        riwayatContainer.appendChild(div);
      });
    }

    function logout() {
      localStorage.removeItem("loggedIn");
      localStorage.removeItem("loggedInUser");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
