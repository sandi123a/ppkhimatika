<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <nav class="bg-green-700 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">GoSampah</h1>
      <div id="nav-auth">
        <a href="index.html" class="mr-4 hover:underline">Login</a>
      </div>
    </div>
  </nav>

  <section class="py-12 px-4 text-center">
    <h2 class="text-4xl font-bold mb-4">Daftar Akun Baru</h2>
    <form id="formDaftar" class="max-w-md mx-auto space-y-4">
      <div>
        <label class="block mb-1 font-medium">Nama Lengkap</label>
        <input type="text" id="namaLengkap" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-green-300" required />
      </div>
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" id="daftarEmail" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-green-300" required />
      </div>
      <div>
        <label class="block mb-1 font-medium">Kata Sandi</label>
        <input type="password" id="daftarPassword" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-green-300" required />
      </div>
      <div>
        <label class="block mb-1 font-medium">Lokasi</label>
        <input type="text" id="lokasi" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-green-300" required />
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">Daftar</button>
    </form>
  </section>

  <footer class="bg-green-700 text-white text-center py-4">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    document.getElementById('formDaftar').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('daftarEmail').value;
      const password = document.getElementById('daftarPassword').value;
      const namaLengkap = document.getElementById('namaLengkap').value;

      if (localStorage.getItem('userEmail')) {
        alert('Email sudah terdaftar!');
      } else {
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userPassword', password);
        alert('Akun berhasil dibuat! Silakan login.');
        window.location.href = "index.html"; // Redirect ke halaman login setelah daftar
      }
    });
  </script>
</body>
</html>
