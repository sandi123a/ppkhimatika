<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Peringkat Pengguna - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">

  <nav class="bg-green-700 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Peringkat Pengguna</h1>
      <button onclick="kembali()" class="bg-white text-green-700 px-4 py-1 rounded hover:bg-gray-200">Kembali</button>
    </div>
  </nav>

  <main class="p-6 max-w-3xl mx-auto">
    <h2 class="text-2xl font-bold mb-4 text-center">Peringkat Berdasarkan Poin</h2>
    <div id="peringkatList" class="bg-white rounded shadow p-4 space-y-2"></div>
  </main>

  <script>
    function kembali() {
      window.history.back();
    }

    function tampilkanPeringkat() {
      const semuaUser = JSON.parse(localStorage.getItem("allUsers")) || [];

      semuaUser.sort((a, b) => (b.points || 0) - (a.points || 0));

      const list = document.getElementById("peringkatList");
      list.innerHTML = "";

      semuaUser.forEach((user, index) => {
        const div = document.createElement("div");
        div.className = "flex justify-between p-2 border-b";
        div.innerHTML = `
          <span>#${index + 1} - ${user.fullName}</span>
          <span>${user.points || 0} poin</span>
        `;
        list.appendChild(div);
      });
    }

    tampilkanPeringkat();
  </script>

</body>
</html>
