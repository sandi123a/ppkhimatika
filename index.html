<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - GoSampah</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 text-gray-800">
  <nav class="bg-green-700 p-4 text-white">
    <div class="container mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">GoSampah</h1>
      <div id="nav-auth">
        <a href="daftar.html" class="mr-4 hover:underline">Daftar</a>
      </div>
    </div>
  </nav>

  <section class="py-12 px-4 text-center">
    <h2 class="text-4xl font-bold mb-4">Login Pengguna</h2>
    <form class="max-w-md mx-auto space-y-4">
      <div>
        <label class="block mb-1 font-medium">Email</label>
        <input type="email" id="loginEmail" class="w-full px-4 py-2 border rounded-md focus:outline-none focus:ring focus:ring-green-300" required />
      </div>
      <div>
        <label class="block mb-1 font-medium">Kata Sandi</label>
        <div class="relative">
          <input type="password" id="loginPassword" class="w-full px-4 py-2 border rounded-md pr-10 focus:outline-none focus:ring focus:ring-green-300" required />
          <button type="button" onclick="togglePassword()" class="absolute right-2 top-2 text-sm text-green-600">Lihat</button>
        </div>
      </div>
      <div class="text-right text-sm">
        <a href="lupa-sandi.html" class="text-green-600 hover:underline">Lupa Kata Sandi?</a>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-md hover:bg-green-700">Login</button>
    </form>
    <p class="text-center mt-4 text-sm">Belum punya akun? <a href="daftar.html" class="text-green-600 hover:underline">Daftar di sini</a></p>
  </section>

  <footer class="bg-green-700 text-white text-center py-4">
    <p>&copy; 2025 GoSampah. Semua hak dilindungi.</p>
  </footer>

  <script>
    function togglePassword() {
      const passInput = document.getElementById('loginPassword');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    }

    document.querySelector('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      // Login sebagai admin
      if (email === "admin12345@gosampah.com" && password === "admin12345") {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("loggedInUser", "admin12345@gosampah.com");
        window.location.href = "admin.html";
        return;
      }

      // Login sebagai user biasa
      const savedEmail = localStorage.getItem("userEmail");
      const savedPassword = localStorage.getItem("userPassword");

      if (email === savedEmail && password === savedPassword) {
        localStorage.setItem("loggedIn", "true");
        localStorage.setItem("loggedInUser", savedEmail);
        window.location.href = "input-sampah.html";
      } else {
        alert('Email atau kata sandi salah!');
      }
    });
  </script>
</body>
</html>
